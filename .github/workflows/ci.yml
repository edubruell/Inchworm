name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # The gates only mean something if something other than a human runs them.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm is pinned, not inherited. `node-version: 24` floats to the latest
      # 24.x, and its bundled npm floats with it — 11.6.2 and 11.19.0 key
      # nested optional platform packages differently, so a lockfile written by
      # one is rejected by the other with EUSAGE and the job dies before the
      # first gate. Bumping this pin and re-running `npm install
      # --package-lock-only` are one commit, never two.
      - run: npm i -g npm@11.19.0
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The build runs before the suite: `tests/csp.test.ts` checks the built
      # copy of index.html, and a gate that skips itself is not a gate.
      - run: npx electron-vite build
      - run: npm test
